     webkit.messageHandlers.hyimg. Edits here show with ⌘R, no rebuild. Colours and type are the canvas tokens (canvas.html). -->

<script>// the window is dragged by the empty part of its top band (ui/dragband.js): Home's columns are background, the loading screen too
window.HY_DRAG = { flat: ".app, main, .top, .sp, aside, .grow, .body, #load" };   // the loading screen is background, its plate's house and folder are not
// the window buttons' capsule (#wl) is the app's and goes in full screen: the app says when (hyimgFS), a reloaded page guesses from its size
if ((() => { try { return !!window.webkit.messageHandlers.hyimg; } catch { return false; } })()) document.documentElement.classList.add("in-app");
{ let told = false; const set = on => document.documentElement.classList.toggle("hy-fs", on);
  window.hyimgFS = on => { told = true; set(on); };
  const guess = () => { if (!told) set(innerWidth >= screen.width - 1 && innerHeight >= screen.height - 1); };
  guess(); addEventListener("resize", guess); }
// the page itself never zooms (owner 2026-10-04: «the built-in zoom is never acceptable in our app»)
addEventListener("wheel", e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false, capture: true });   // capture: a panel that stops the wheel still cannot let it zoom
["gesturestart", "gesturechange", "gestureend"].forEach(t => addEventListener(t, e => e.preventDefault(), { passive: false, capture: true }));</script>

.body { overflow: auto; padding: 20px 32px 72px; min-height: 0; }
.head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 18px; }

.head .vt { align-self: center; margin-left: auto; display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--raise); }
.head .vt button { width: 30px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; transition: background .15s ease, color .15s ease; }

:root[data-shape=pro] .head .vt { border-radius: 8px; } :root[data-shape=pro] .head .vt button { border-radius: 6px; }
.list { display: flex; flex-direction: column; }
.list .lh, .list .card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 170px) minmax(0, 1.5fr) 140px 76px; align-items: center; gap: 16px; padding: 0 10px; }
.list .lh { height: 30px; border-bottom: 1px solid var(--line); color: var(--muted); font: 500 12px var(--sans); }

.list .card:hover, .list .card:focus-visible { background: var(--raise); }

.list .card .n { font: 500 14px/1.3 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .card .op { display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 99px; background: #22c55e; vertical-align: 2px; }
.list .card .c2, .list .card .c3 { color: var(--sub); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.list .card .c3 { color: var(--muted); font-variant-numeric: tabular-nums; }

.list .card .pth { justify-self: start; max-width: 100%; display: inline-flex; align-items: center; gap: 7px; height: 28px; margin-left: -8px; padding: 0 8px; border: 0; border-radius: 7px;

.list .card .more { margin: 0; }
.list .card.missing .n { color: var(--warn); }
.card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; border-radius: 12px; }
.cover { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; background: var(--raise); box-shadow: var(--hy-sh-ctl), inset 0 0 0 1px var(--line); }
.cover .mos { position: absolute; inset: 0; display: grid; grid-template-columns: 1.6fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
.cover .mos img { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--raise); }
.cover .mos img:first-child { grid-row: span 2; }
.cover .mos.one { grid-template-columns: 1fr; } .cover .mos.one img:first-child { grid-row: auto; }
.cover .dots { position: absolute; inset: 0; background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 16%, transparent) 1px, transparent 1.6px); background-size: 18px 18px; display: grid; place-items: center; color: var(--muted); }
.card:hover .cover { box-shadow: var(--hy-sh-pop), 0 0 0 3px color-mix(in srgb, var(--sel) 40%, transparent); }
.card:focus-visible { outline: none; }
.meta { display: flex; align-items: flex-start; gap: 8px; padding: 0 2px; }
.meta .t { flex: 1; min-width: 0; }
.meta .n { font: 500 14px/1.3 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .s { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more { width: 28px; height: 28px; margin-top: -3px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; opacity: 0; }
.card:hover .more, .more[aria-expanded=true] { opacity: 1; }
.more:hover { background: var(--raise); color: var(--ink); }
.chip { position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 99px; background: rgba(9,9,11,.72); color: #fafafa !important; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font: 500 11px var(--sans); color: var(--ink); }
.chip i { width: 6px; height: 6px; border-radius: 99px; background: #22c55e; }
/* the heart in the cover's top right corner (owner 2026-10-04): on hover, and always once the board is a favourite */
.fav { position: absolute; right: 8px; top: 8px; z-index: 2; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 99px;
  background: rgba(9,9,11,.55); color: #fafafa; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer;
  opacity: 0; transform: scale(.8); transition: opacity .18s ease, transform .25s cubic-bezier(.2, .9, .3, 1.15), background .15s ease; }
.card:hover .fav, .fav[aria-pressed=true], .fav:focus-visible { opacity: 1; transform: none; }
.fav:hover { background: rgba(9,9,11,.75); }
.fav svg { width: 16px; height: 16px; transition: fill .15s ease, color .15s ease; }
.fav[aria-pressed=true] svg { fill: #ff4d6d; color: #ff4d6d; }
.fav.pop svg { animation: favPop .38s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes favPop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: none; } }
aside .nav .hrt { width: 16px; height: 16px; flex: none; color: #ff4d6d; }
.card.missing .cover .mos { opacity: .25; filter: grayscale(1); }
.card.missing .warn { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; color: var(--warn); font-weight: 500; }
.card.missing .warn .btn { justify-self: center; color: var(--ink); background: var(--bg); }

.empty { display: grid; place-items: center; min-height: 60vh; text-align: center; }
.empty h2 { margin: 0 0 6px; font: 600 18px var(--sans); }
.empty p { margin: 0 0 18px; color: var(--sub); max-width: 46ch; }
.empty .row { display: flex; gap: 10px; justify-content: center; }
.none { color: var(--muted); padding: 30px 0; }

.menu { position: fixed; z-index: 50; min-width: 210px; padding: 5px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--hy-sh-pop); display: none; }
.menu.open { display: block; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--raise2); outline: none; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
kbd { margin-left: auto; color: var(--muted); font: 11px var(--sans); }
/* a project's icon: ui/look.css .pji */
aside .nav [data-ficon] { display: grid; border-radius: 5px; transition: background .15s ease; }
aside .nav [data-ficon]:hover { background: var(--raise2); }
.head .hic { align-self: center; display: grid; padding: 3px; margin: -3px -4px -3px -3px; border: 0; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; transition: background .15s ease; }
.head .hic:hover { background: var(--raise); }
/* the picker, as the project's icon in ChatGPT: Иконка (a colour and a line icon) or Эмодзи (a grid and a field for any) */
#pjpick { position: fixed; z-index: 55; width: 288px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--hy-sh-pop);
  opacity: 0; transform: scale(.96) translateY(-4px); transform-origin: 20px 0; pointer-events: none; transition: opacity .16s ease, transform .22s cubic-bezier(.3, .8, .25, 1); }
#pjpick.open { opacity: 1; transform: none; pointer-events: auto; }
#pjpick .pjt { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; margin-bottom: 10px; border-radius: 9px; background: var(--raise); }
#pjpick .pjt button { height: 26px; border: 0; border-radius: 7px; background: none; color: var(--sub); font: 500 12px var(--sans); cursor: pointer; transition: background .15s ease, color .15s ease; }
#pjpick .pjt button[aria-selected=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
#pjpick .pjc { display: flex; justify-content: space-between; margin: 0 2px 10px; }
#pjpick .pjc button { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--c); cursor: pointer; box-shadow: 0 0 0 2px var(--panel) inset; transition: box-shadow .15s ease; }
#pjpick .pjc button[aria-pressed=true] { box-shadow: 0 0 0 2px var(--panel) inset, 0 0 0 2px var(--c); }
#pjpick .pjg { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; max-height: 240px; overflow: hidden auto; }
#pjpick .pjg button { aspect-ratio: 1; min-width: 0; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--ink); cursor: pointer; font-size: 18px; line-height: 1; transition: background .12s ease; }
#pjpick .pjg button:hover { background: var(--raise); }
#pjpick .pjg button[aria-pressed=true] { background: var(--raise2); box-shadow: inset 0 0 0 1.5px var(--sel); }
#pjpick .pjg svg { width: 18px; height: 18px; }
#pjpick .pjin { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font: 500 12px var(--sans); }
#pjpick .pjin input { flex: 1; min-width: 0; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); color: var(--ink); font: 13px var(--sans); outline: none; }
#pjpick .pjin input:focus { border-color: var(--sel); }
:root[data-shape=pro] #pjpick { border-radius: 11px; }
@media (prefers-reduced-motion: no-preference) { .card .cover { transition: box-shadow .12s; } }
</style>
</head>
<body>
<div class="app">
  <aside aria-label="Разделы">
    <button class="nav" data-tab="recent" aria-current="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span class="nm">Недавние</span></button>
    <button class="nav" data-tab="all"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="nm">Все доски</span></button>
    <div class="plist" id="plist"></div>
    <div class="grow"></div>
  </aside>
  <main>
    <div class="top">
      <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="q" placeholder="Найти доску" aria-label="Найти доску"></label>
      <div class="sp"></div>
      <button class="btn primary" data-act="create"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Новая доска</button>
    </div>
    <div class="body" id="body"></div>
  </main>
</div>
<div class="menu" id="menu" role="menu"></div>
<div id="pjpick" role="dialog" aria-label="Иконка проекта"></div>
<div id="wl" aria-hidden="true"></div>
<div id="load" aria-live="polite"><span class="lb" aria-hidden="true"><svg class="lbi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><rect class="pane" x="5.5" y="6.5" width="6" height="11" rx="1" fill="currentColor" stroke="none"/></svg></span><canvas id="stars" aria-hidden="true"></canvas><div class="crumb"><span class="hm" title="Главная: доска догрузится сама"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg></span><span class="cs"><svg class="hy-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span><span class="fd" hidden title="Проект на главной: доска догрузится сама"><i class="fdi"></i><span class="fdn"></span></span><span class="cs fds" hidden><svg class="hy-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span><span class="nm"></span><span class="cs"><svg class="hy-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span><span class="pg"><span class="pn"></span><svg class="hy-chev dn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></div><div class="steps"><ol></ol></div></div>
<button id="bset" title="Настройки приложения" aria-label="Настройки приложения" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<div id="sets" role="dialog" aria-label="Настройки приложения">
  <div class="sh">Тема</div><div class="opts" data-set="cv.theme"><button data-v="auto" title="Как в macOS: днем светлая, вечером темная, если так настроено в системе">Авто</button><button data-v="dark" title="Темная тема, графитовая бумага">Темная</button><button data-v="light" title="Светлая тема, светлая бумага">Светлая</button></div>
  <div class="sh">Зерно бумаги</div><div class="opts" data-set="cv.grain"><button data-v="0">Очень тонкое</button><button data-v="1">Тонкое</button><button data-v="2">Заметное</button><button data-v="3">Сильное</button></div>
  <div id="engineSet" hidden><div class="sh">Движок</div><div class="opts" id="engineOpts"><button data-engine="webkit" title="Движок macOS, как Safari: рисует процессором">WebKit</button><button data-engine="chromium" title="Движок Chrome внутри Hyimg: доска рисуется видеокартой и не тормозит">Chromium</button></div></div>
  <div class="sh">Отрисовка</div><div class="opts" data-set="cv.lod"><button data-v="0" title="Каждая картинка отдельным элементом">Обычная</button><button data-v="1" title="Издалека картинки рисуются одним холстом (canvas 2D)">Холст</button><button data-v="2" title="Издалека картинки рисует видеокарта (WebGL), как в Figma">WebGL</button></div>
  <div class="sh">Заметки</div><div class="opts" data-set="cv.glass"><button data-v="1" title="Полупрозрачные, под ними сильное размытие">Стекло</button><button data-v="0" title="Плотные, без размытия">Плотные</button></div>
  <div class="sh">Точки</div><div class="opts" data-set="cv.dotsgl"><button data-v="0" title="Сетка из слоев CSS, как всегда">Обычные</button><button data-v="1" title="Одним слоем WebGL: живые, по ним идут волны, когда кладешь картинки">WebGL</button></div>
  <div class="sh">Тени</div><div class="opts" data-set="cv.shadow"><button data-v="1" title="Плашки и кнопки парят над доской">С тенями</button><button data-v="0" title="Плашки лежат плоско">Без теней</button></div>
  <div class="sh">Углы</div><div class="opts" data-set="cv.shape"><button data-v="round" title="Кнопки и плашки круглые">Круглые</button><button data-v="pro" title="Строже: почти квадратные, с умеренным радиусом">Pro</button></div>
  <div class="sh">Цвет бумаги</div>
  <div class="paper"><label>Темная<input type="color" data-paper="paperDark" aria-label="Цвет бумаги в темной теме"></label><label>Светлая<input type="color" data-paper="paperLight" aria-label="Цвет бумаги в светлой теме"></label><button data-paper-reset title="Вернуть цвета по умолчанию">Сбросить</button></div>
  <div class="sh">Видимость точек <span id="dotsVal"></span></div>
  <input id="dotsVis" class="range" type="range" min="0" max="300" step="5" aria-label="Видимость точек, процентов">
  <div class="setnote">Одни для всего приложения: главная и все доски.</div></div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const send = (action, id) => { try { webkit.messageHandlers.hyimg.postMessage({ action, id }); } catch (e) { console.log("no native bridge", action, id); } };
let DATA = null, TAB = "recent";   // null until the app sends the projects: Home shows it is loading, not «no projects»
let HOME = { folders: [] }, EDIT = null;   // folders of projects (home.json through the app); the folder being named
const saveHome = () => { try { webkit.messageHandlers.hyimg.postMessage({ action: "homeSave", home: HOME }); } catch (e) { console.log("no native bridge", HOME); } };
const folderOf = id => HOME.folders.find(f => f.projects.includes(id));
const ICO_PROJ = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 15.5 9 11l4 3.5 2.5-2 4.5 3.5"/></svg>`;
try { TAB = localStorage.getItem("home.tab") || "recent"; } catch {}

function ago(ts) {
  if (!ts) return "еще не открывалась";
  const s = (Date.now() - ts * 1000) / 1000;
  if (s < 60) return "изменена только что";
  if (s < 3600) return `изменена ${Math.round(s / 60)} мин назад`;
  if (s < 86400) return `изменена ${Math.round(s / 3600)} ч назад`;
  const d = new Date(ts * 1000), y = new Date(Date.now() - 864e5);
  if (d.toDateString() === y.toDateString()) return "изменена вчера";
  return "изменена " + d.toLocaleDateString("ru", { day: "numeric", month: "long" });
}
const plural = (n, a, b, c) => `${n.toLocaleString("ru-RU")} ${n % 10 === 1 && n % 100 !== 11 ? a : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? b : c}`;

function cover(p) {
  const im = (p.covers || []).slice(0, 3);
  if (!im.length) return `<div class="dots"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg></div>`;
  return `<div class="mos ${im.length < 3 ? "one" : ""}">${(im.length < 3 ? im.slice(0, 1) : im).map(u => `<img src="${esc(u)}" alt="" loading="lazy" decoding="async">`).join("")}</div>`;
}
function cardHtml(p) {
  const meta = [ago(p.updated), p.onCanvas ? plural(p.onCanvas, "кадр на холсте", "кадра на холсте", "кадров на холсте") : ""].filter(Boolean).join(" · ");
  return `<div class="card ${p.available ? "" : "missing"}" role="button" tabindex="0" data-id="${p.id}" draggable="true" aria-label="Открыть ${esc(p.name)}">
    <div class="cover">${cover(p)}<button class="fav" data-fav="${p.id}" aria-pressed="${isFav(p.id)}" aria-label="${isFav(p.id) ? "Убрать из избранного" : "В избранное"}" title="${isFav(p.id) ? "Убрать из избранного" : "В избранное"}">${HEART}</button>${p.open ? `<span class="chip"><i></i>открыта</span>` : ""}<div class="prog" data-prog="${p.id}" aria-live="polite"><ol></ol></div>
      ${p.available ? "" : `<div class="warn">Папка недоступна<button class="btn" data-act="relink" data-id="${p.id}">Указать папку…</button></div>`}</div>
    <div class="meta"><div class="t"><div class="n">${esc(p.name)}</div><div class="s" title="${esc(p.path)}">${esc(meta)}</div></div>
      <button class="more" data-more="${p.id}" aria-label="Действия с доской" aria-haspopup="menu" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg></button></div>
  </div>`;
}
// favourites (owner 2026-10-04: «instead of "no folder", favourites, moved to the top, gone while there are none; a heart, and a button
// for it in the thumbnail's top right corner»): home.json favs[], board ids in the order they were added
const HEART = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 19.5s-7.5-4.4-7.5-9.7A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6c0 5.3-7.5 9.7-7.5 9.7z"/></svg>`;
const isFav = id => (HOME.favs || []).includes(id);
function toggleFav(id) {
  const on = !isFav(id); HOME.favs = on ? [...(HOME.favs || []), id] : HOME.favs.filter(x => x !== id);
  saveHome(); render();
  if (on) { const b = document.querySelector(`.fav[data-fav="${id}"]`); if (b) b.classList.add("pop"); }
}
// a folder's path the way Finder's title shows it: the home folder as ~
const shortPath = path => (path || "").replace(/^\/Users\/[^/]+/, "~");
// the folders it is in, then the folder itself; a path too long loses its start, never the folder's own name
const pathHtml = path => { const s = shortPath(path), i = s.lastIndexOf("/"); return i < 0 ? `<b>${esc(s)}</b>` : esc(s.slice(0, i + 1)) + `<b>${esc(s.slice(i + 1))}</b>`; };
// a board as a row of the list: a small cover, its name, its project, when it changed, the heart and «⋯»
function rowHtml(p) {
  const f = folderOf(p.id), fav = isFav(p.id), fl = fav ? "Убрать из избранного" : "В избранное";
  return `<div class="card ${p.available ? "" : "missing"}" role="button" tabindex="0" data-id="${p.id}" draggable="true" aria-label="Открыть ${esc(p.name)}" title="${esc(p.path)}">

    + "<hr>" + HOME.folders.filter(f => f !== inF).map(f => hyMenuItem(`data-local="move" data-id="${id}" data-f="${f.id}"`, HY_PROJ.html(f, 15), `В проект «${esc(f.name)}»`)).join("")
    + hyMenuItem(`data-local="newfolder" data-id="${id}"`, "plus", "В новый проект")
    + (inF ? hyMenuItem(`data-local="unfile" data-id="${id}"`, "unfile", `Убрать из проекта «${esc(inF.name)}»`) : "")
    + "<hr>" + hyMenuItem(`data-act="relink" data-id="${id}"`, "relink", "Указать папку в Finder…") + hyMenuItem(`data-act="openFolder" data-id="${id}"`, "folder", "Открыть папку") + hyMenuItem(`data-act="reveal" data-id="${id}"`, "finder", "Показать в Finder")
    // its server without opening it (owner 2026-10-04): started, it loads behind with its steps on the card; stopped, its green mark goes
    + "<hr>" + (p.open ? hyMenuItem(`data-act="stopServer" data-id="${id}"`, "stop", "Остановить сервер") : hyMenuItem(`data-act="startServer" data-id="${id}"`, "play", "Запустить сервер"));
  m.classList.add("open");
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + "px"; m.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  document.querySelectorAll(".more[aria-expanded=true]").forEach(b => b.setAttribute("aria-expanded", "false"));
  if (btn) btn.setAttribute("aria-expanded", "true");
  m.querySelector("button").focus();
}
function openProject(id) { send("open", id); }   // the app reports the steps if it has to load it
// a menu of its own: the empty space (a new project, a Finder folder as a project, a new folder) and a folder (rename, delete)
function openMenuHtml(html, x, y) {
  const m = $("#menu"); m.innerHTML = html; m.classList.add("open");
  const r = m.getBoundingClientRect(); m.style.left = Math.min(x, innerWidth - r.width - 8) + "px"; m.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
}
function closeMenu() { $("#menu").classList.remove("open"); document.querySelectorAll(".more[aria-expanded=true]").forEach(b => b.setAttribute("aria-expanded", "false")); }

document.addEventListener("click", e => {
  const more = e.target.closest("[data-more]");
  if (more) { e.stopPropagation(); const r = more.getBoundingClientRect(); openMenu(more.dataset.more, r.right - 210, r.bottom + 6, more); return; }
  const loc = e.target.closest("[data-local]");
  if (loc) { closeMenu(); const a = loc.dataset.local, id = loc.dataset.id;
    if (a === "move") moveTo(id, loc.dataset.f); else if (a === "unfile") moveTo(id, null); else if (a === "newfolder") newFolder(id || null);
    else if (a === "renamefolder") { EDIT = loc.dataset.f; render(); }
    else if (a === "iconfolder") { const el = document.querySelector(`aside [data-ficon="${loc.dataset.f}"]`); if (el) openPick(loc.dataset.f, el); }
    else if (a === "delfolder") { HOME.folders = HOME.folders.filter(f => f.id !== loc.dataset.f); if (TAB === "f:" + loc.dataset.f) TAB = "all"; saveHome(); render(); }
    return; }
  const fi = e.target.closest("[data-ficon]"); if (fi && EDIT !== fi.dataset.ficon) { closeMenu(); PJ && PJ.id === fi.dataset.ficon ? closePick() : openPick(fi.dataset.ficon, fi); return; }
  if (PJ && !e.target.closest("#pjpick")) closePick();
  const vw = e.target.closest("[data-view]"); if (vw) { if ((HOME.view || "grid") !== vw.dataset.view) { HOME.view = vw.dataset.view; saveHome(); render(); } return; }
  const fv = e.target.closest("[data-fav]"); if (fv) { closeMenu(); toggleFav(fv.dataset.fav); return; }
  // a double click renames the folder in place, as a page's name in the board's pages menu (owner 2026-10-04); the first click has
  // drawn the list again, so the second one is caught here (detail 2), a dblclick would land on an element no longer there
  // the folder being named takes no click of its own: a space typed in its name pressed the folder's button and drew the list again
  if (e.target.closest("[data-folder]") && EDIT === e.target.closest("[data-folder]").dataset.folder) return;
  const fo = e.target.closest("[data-folder]"); if (fo && !e.target.closest("input")) { if (e.detail >= 2) EDIT = fo.dataset.folder; TAB = "f:" + fo.dataset.folder; render(); return; }
  const act = e.target.closest("[data-act]");
  if (act) { closeMenu(); send(act.dataset.act === "open" ? "open" : act.dataset.act, act.dataset.id || null); return; }
  if (!e.target.closest("#menu")) closeMenu();
  const tab = e.target.closest("[data-tab]"); if (tab) { TAB = tab.dataset.tab; try { localStorage.setItem("home.tab", TAB); } catch {} render(); return; }
  const op = e.target.closest("[data-open]"); if (op) { openProject(op.dataset.open); return; }
  const card = e.target.closest(".card"); if (card && !card.classList.contains("missing")) openProject(card.dataset.id);
});
document.addEventListener("contextmenu", e => {
  if (e.target.closest("input")) return;
  e.preventDefault();
  const card = e.target.closest(".card, [data-open]"); if (card) return openMenu(card.dataset.id || card.dataset.open, e.clientX, e.clientY);
  const fo = e.target.closest("[data-folder]");
  if (fo) return openMenuHtml(hyMenuItem(`data-local="renamefolder" data-f="${fo.dataset.folder}"`, "rename", "Переименовать проект")
    + hyMenuItem(`data-local="iconfolder" data-f="${fo.dataset.folder}"`, HY_PROJ.html(HOME.folders.find(f => f.id === fo.dataset.folder), 15), "Иконка проекта…") + "<hr>"
    + hyMenuItem(`data-local="delfolder" data-f="${fo.dataset.folder}"`, "del", `Удалить проект <span class="mh">доски останутся</span>`), e.clientX, e.clientY);
  openMenuHtml(hyMenuItem('data-act="create"', "plus", "Новая доска") + hyMenuItem('data-act="add"', "folder", "Доска из папки Finder…") + "<hr>" + hyMenuItem('data-local="newfolder"', "folder", "Новый проект"), e.clientX, e.clientY);
});
// naming a folder: Enter or leaving the field keeps the name, Esc keeps the old one
document.addEventListener("keydown", e => { const i = e.target.closest && e.target.closest("input[data-fname]"); if (!i) return; e.stopPropagation();
  if (e.key === "Enter") nameFolder(i.dataset.fname, i.value); else if (e.key === "Escape") { EDIT = null; render(); } }, true);
document.addEventListener("keyup", e => { if (e.key === " " && e.target.closest && e.target.closest("input[data-fname]")) e.preventDefault(); }, true);   // a space stays in the name
document.addEventListener("focusout", e => { const i = e.target.closest && e.target.closest("input[data-fname]"); if (i && EDIT === i.dataset.fname) nameFolder(i.dataset.fname, i.value); });
// a project dragged onto a folder goes into it; onto «Все доски» or the empty side it leaves its folder
let DRAG = null;
document.addEventListener("dragstart", e => { const c = e.target.closest(".card, [data-open]"); if (!c) return; DRAG = c.dataset.id || c.dataset.open; e.dataTransfer.setData("text/plain", DRAG); e.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", e => { if (!DRAG) return; const t = e.target.closest("[data-folder], [data-tab=all], [data-tab=none]"); document.querySelectorAll(".drop").forEach(x => x !== t && x.classList.remove("drop")); if (t) { e.preventDefault(); t.classList.add("drop"); } });
document.addEventListener("drop", e => { const t = e.target.closest("[data-folder], [data-tab=all], [data-tab=none]"); document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); if (!DRAG || !t) return; e.preventDefault(); moveTo(DRAG, t.dataset.folder || null); DRAG = null; });
document.addEventListener("dragend", () => { DRAG = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeMenu(); if (PJ) return closePick(); if (document.activeElement === $("#q") && $("#q").value) { $("#q").value = ""; render(); } return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); $("#q").focus(); $("#q").select(); return; }
  const card = e.target.closest && !e.target.closest("button") && e.target.closest(".card");
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (!card.classList.contains("missing")) openProject(card.dataset.id); }
});
$("#q").addEventListener("input", render);

// a project's icon (owner 2026-10-04: «change a project's icon as in ChatGPT, an emoji or an icon»): the picker opens under the
// icon pressed (the sidebar's, the head's) or from the project's right click; every pick is saved at once and drawn everywhere
let PJ = null;
function openPick(id, anchor) {
  const f = HOME.folders.find(x => x.id === id); if (!f) return;
  PJ = { id, tab: null }; drawPick();
  const p = $("#pjpick"), r = anchor.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left - 6, innerWidth - p.offsetWidth - 8)) + "px";
  p.style.top = Math.min(r.bottom + 6, innerHeight - p.offsetHeight - 8) + "px";
  requestAnimationFrame(() => p.classList.add("open"));
}
function drawPick() {
  const f = PJ && HOME.folders.find(x => x.id === PJ.id); if (!f) return closePick();
  $("#pjpick").innerHTML = HY_PROJ.picker(f, PJ.tab);
}
function closePick() { PJ = null; $("#pjpick").classList.remove("open"); }
function setIcon(patch) {
  const f = PJ && HOME.folders.find(x => x.id === PJ.id); if (!f) return;
  Object.entries(patch).forEach(([k, v]) => { if (v) f[k] = v; else delete f[k]; });
  saveHome(); render(); drawPick();
}
$("#pjpick").addEventListener("click", e => {
  e.stopPropagation();
  const t = e.target.closest("[data-pjtab]"); if (t) { PJ.tab = t.dataset.pjtab; drawPick(); if (PJ.tab === "emoji") $("#pjpick [data-pjown]").focus(); return; }
  const c = e.target.closest("[data-pjcolor]"); if (c) { const f = HOME.folders.find(x => x.id === PJ.id); setIcon(HY_PROJ.isIcon(f.icon) ? { color: c.dataset.pjcolor } : { color: c.dataset.pjcolor, icon: "layers" }); return; }
  const i = e.target.closest("[data-pjicon]"); if (i) { setIcon({ icon: i.dataset.pjicon === "layers" ? null : i.dataset.pjicon }); return; }
  const m = e.target.closest("[data-pjemoji]"); if (m) { PJ.tab = "emoji"; setIcon({ icon: m.dataset.pjemoji }); }
});
// any emoji of its own: the first character typed or pasted (macOS ⌃⌘Space opens the system's emoji panel in the field)
$("#pjpick").addEventListener("input", e => {
  if (!e.target.matches("[data-pjown]")) return;
  const v = e.target.value.trim(); if (!v) return;
  const g = window.Intl && Intl.Segmenter ? [...new Intl.Segmenter().segment(v)][0].segment : [...v][0];
  const f = HOME.folders.find(x => x.id === PJ.id); f.icon = g; saveHome(); render();
  document.querySelectorAll("#pjpick [data-pjemoji]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pjemoji === g));
});
$("#pjpick").addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); closePick(); } else if (e.key === "Enter") closePick(); });
try { SET = JSON.parse(localStorage.getItem("home.set") || "{}") || {}; } catch {}   // the theme the app sent last time, until it sends it again
applySettings();
render();
send("ready");
</script>
